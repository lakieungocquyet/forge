[package]
name = "forge"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.11.1"
chrono = "0.4.44"
color-eyre = "0.6.5"
crossterm = "0.29.0"
portable-pty = "0.9.0"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "sync", "macros"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
tui-term = "0.3.4"
vt100 = "0.16.2"

[dev-dependencies]
cargo-dist = "0.31.0"

